map $http_x_forwarded_proto $odoo_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 4g;
    proxy_read_timeout 720s;
    proxy_send_timeout 720s;

    location /web/filestore/ {
        internal;
        alias /var/lib/odoo/filestore/;
    }

    location / {
        set $odoo_upstream app:8069;
        proxy_pass http://$odoo_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $odoo_forwarded_proto;
        proxy_hide_header X-Sendfile;
    }
}
