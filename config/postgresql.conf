# PostgreSQL 18 and pgvector settings for Odoo 19
# Conservative defaults for development and small deployments
# Tune memory and worker counts for the production host capacity

# CONNECTION
listen_addresses = '*'
# Few concurrent users expected
max_connections = 40
superuser_reserved_connections = 2
max_files_per_process = 100

# MEMORY (Minimal: ~500MB allocation)
# Staging should be lean - just enough to function
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 256MB
work_mem = 8MB
hash_mem_multiplier = 2.0

# WAL & CHECKPOINT
wal_buffers = 8MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# PARALLELISM
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# I/O (NVMe)
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 100

# PLANNER
default_statistics_target = 50
jit = off

# BGWRITER
bgwriter_delay = 500ms
bgwriter_lru_maxpages = 50
bgwriter_lru_multiplier = 2.0

# AUTOVACUUM
autovacuum = on
autovacuum_max_workers = 1
autovacuum_naptime = 60s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 200

# TRANSACTION
max_prepared_transactions = 0

# LOGGING
log_line_prefix = '%m [%p-%l] %u@%d app=%a '
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
# More verbose for debugging staging issues
log_min_duration_statement = 1000
track_io_timing = on

# PERFORMANCE
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 5000

# ODOO TUNING
statement_timeout = 0
lock_timeout = 30000
idle_in_transaction_session_timeout = 600000
