# Representative downstream Compose file; copy and maintain it downstream.
x-runtime: &runtime
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: production
    additional_contexts:
      godoo-sources: ${GODOO_SOURCES_ROOT:?Set GODOO_SOURCES_ROOT}
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
      GODOO_PACKAGE: ${GODOO_PACKAGE:-godoo-cli}
  init: true
  environment:
    ODOO_MAIN_DB: ${ODOO_MAIN_DB:-odoo}
    ODOO_DB_FILTER: ${ODOO_DB_FILTER:-odoo}
    ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?Set ODOO_DB_PASSWORD}
    ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
    ODOO_DB_HOST: ${ODOO_DB_HOST:-db}
    ODOO_DB_PORT: ${ODOO_DB_PORT:-5432}
    ODOO_DATA_DIR: ${ODOO_DATA_DIR:-/var/lib/odoo}
    ODOO_MAIN_FOLDER: ${ODOO_MAIN_FOLDER:-/odoo/odoo}
    ODOO_WORKSPACE_ADDON_LOCATION: ${ODOO_WORKSPACE_ADDON_LOCATION:-/odoo/godoo_workspace/addons}
    ODOO_CONF_PATH: ${ODOO_CONF_PATH:-/odoo/config/odoo.conf}
    GODOO_RUNTIME_SEED: "${GODOO_RUNTIME_SEED:-}"
    GODOO_UPDATE_CHANGED: ${GODOO_UPDATE_CHANGED:-true}
    GODOO_RECONCILE_UPDATE: "${GODOO_RECONCILE_UPDATE:-}"
    GODOO_RECONCILE_INSTALL: "${GODOO_RECONCILE_INSTALL:-}"
    GODOO_X_SENDFILE: ${GODOO_X_SENDFILE:-true}
    GODOO_HOOK_DIRS: "${GODOO_HOOK_DIRS:-}"
    GODOO_ENVIRONMENT: "${GODOO_ENVIRONMENT:-}"
    GODOO_RECONCILE_UPGRADE_PATH: "${GODOO_RECONCILE_UPGRADE_PATH:-}"
    GODOO_RECONCILE_PRE_UPGRADE_SCRIPTS: "${GODOO_RECONCILE_PRE_UPGRADE_SCRIPTS:-}"
    GODOO_REPORT_URL: ${GODOO_REPORT_URL:-http://nginx}
    GODOO_NGINX_CONFIG_PATH: /odoo/config/nginx-static.conf
  volumes:
    - odoo_data:/var/lib/odoo
    - odoo_config:/odoo/config

services:
  init:
    <<: *runtime
    profiles: [maintenance]
    command: [godoo, runtime, init]
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *runtime
    command: [godoo, runtime, start, "--extra-args=${ODOO_BIN_ARGS:+${ODOO_BIN_ARGS} }--proxy-mode"]
    depends_on:
      db:
        condition: service_healthy
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: nginx
      additional_contexts:
        godoo-sources: ${GODOO_SOURCES_ROOT:?Set GODOO_SOURCES_ROOT}
    ports: ["127.0.0.1:8069:80"]
    environment:
      GODOO_NGINX_WEBSOCKET_BACKEND: ${GODOO_NGINX_WEBSOCKET_BACKEND:-app:8072}
      NGINX_ENVSUBST_FILTER: "^GODOO_NGINX_WEBSOCKET_BACKEND$"
    depends_on:
      app:
        condition: service_started
    volumes:
      - ../config/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - odoo_data:/var/lib/odoo:ro
      - odoo_config:/odoo/config:ro
  db:
    image: pgvector/pgvector:pg18-trixie
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    shm_size: 512mb
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?Set ODOO_DB_PASSWORD}
    healthcheck:
      test:
        [
          CMD-SHELL,
          'test "$$(cat /proc/1/comm)" = postgres && pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db_data:/var/lib/postgresql
      - ../config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres-init/10-vector.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro

volumes:
  db_data:
  odoo_data:
  odoo_config:
