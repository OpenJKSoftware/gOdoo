# Select the Odoo and addon repositories managed by `godoo workspace sync`.
# A repository needs a URL and may select a branch, commit, or merge recipe.
# Sync updates shared floating branches and discards edits in managed worktrees.
# Pin a commit for a fixed version; merge recipes are rebuilt on their own branches.

odoo:
  # The required Odoo repository contains odoo-bin.
  url: https://github.com/odoo/odoo/
  branch: 19.0 # Branch is mandatory on Odoo Repo but not on OCA Repos
  # shallow: true # Optional depth-one history; selected refs use full history by default.
thirdparty:
  # In the thirdparty section we can add more Repos to download.
  # This can also be an ssh style Url for Odoo Enterprise for example.
  OCA: # Runtime mounts use the OCA_<repository> name.
    - url: https://github.com/OCA/server-tools
      # branch: 19.0 # Branch is optional here. If not specified, the default branch of the Repo will be used.
      # commit: abcdef1234567890abcdef1234567890abcdef12 # Optional fixed ref; otherwise sync resolves the branch.
    - url: https://github.com/OCA/product-attribute.git
      # merge_from: # We can also Create local merge commits on top of the downloaded Repo.
      #   - url: https://github.com/fd-oerp/product-attribute.git
      #     branch: 19.0-mig-product_sequence

    # Uncomment Enterprise if you have access to the Repo
    # - url: git@github.com:odoo/enterprise.git
