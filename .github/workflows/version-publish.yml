name: Release and Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      EXPECTED_REPO: ${{ github.repository }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Verify release pull request
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PR_HEAD_REPO" != "$EXPECTED_REPO" ]]; then
            echo "Release pull request must come from this repository." >&2
            exit 1
          fi
          if [[ "$PR_TITLE" != "🔖 Release "* ]]; then
            echo "Release pull request title must start with '🔖 Release '." >&2
            exit 1
          fi
          RELEASE_VERSION="${PR_TITLE#🔖 Release }"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a[0-9]+|b[0-9]+|rc[0-9]+)?$ ]]; then
            echo "Release pull request title must end with a semantic version." >&2
            exit 1
          fi
          if [[ "$PR_HEAD_REF" != "release/$RELEASE_VERSION" ]]; then
            echo "Expected release branch release/$RELEASE_VERSION, got $PR_HEAD_REF." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]]; then
            echo "Checked out commit does not match the release merge commit." >&2
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Verify package version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(hatch version)"
          if [[ "$VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Version mismatch: project has $VERSION, release pull request is $RELEASE_VERSION." >&2
            exit 1
          fi

      - name: Preflight existing Git tag
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
            if [[ "$TAG_COMMIT" != "$MERGE_SHA" ]]; then
              echo "Existing tag $TAG points to $TAG_COMMIT, expected $MERGE_SHA." >&2
              exit 1
            fi
          fi

      - name: Build distributions
        run: hatch build

      - name: Publish to PyPI
        env:
          HATCH_INDEX_USER: __token__
          HATCH_INDEX_AUTH: ${{ secrets.PYPI_TOKEN }}
        run: hatch publish

      - name: Create or verify Git tag
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
            if [[ "$TAG_COMMIT" != "$MERGE_SHA" ]]; then
              echo "Existing tag $TAG points to $TAG_COMMIT, expected $MERGE_SHA." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$MERGE_SHA" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; preserving its description."
            exit 0
          fi
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          printf '%s' "$PR_BODY" > "$NOTES_FILE"
          RELEASE_FLAGS=()
          if [[ "$RELEASE_VERSION" =~ (a[0-9]+|b[0-9]+|rc[0-9]+)$ ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES_FILE" "${RELEASE_FLAGS[@]}"
