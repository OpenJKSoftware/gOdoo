name: Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  QualityChecks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: uv sync --locked
      - name: Build and smoke test wheel
        run: |
          set -eu
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          uv build --wheel --out-dir "$smoke_dir"
          uv venv "$smoke_dir/venv"
          uv pip install --python "$smoke_dir/venv/bin/python" "$smoke_dir"/*.whl
          cd "$smoke_dir"
          env -u PYTHONPATH "$smoke_dir/venv/bin/python" -c "import godoo_cli"
          env -u PYTHONPATH "$smoke_dir/venv/bin/godoo" --help
      - run: cp .env.sample .env
      - run: make lint
      - run: make test PYTEST_ARGS="--junitxml=junit/pytest-results.xml --cov-report=xml -o junit_family=legacy"
        env:
          GODOO_SOURCES_ROOT: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit/pytest-results.xml
            coverage.xml
